apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: end-to-end-devops-project
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/PoojaBusa/end-to-end-devops-project.git
    targetRevision: main
    path: kubernetes

  destination:
    server: https://kubernetes.default.svc
    namespace: end-to-end-devops-project

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
