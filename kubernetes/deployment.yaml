apiVersion: apps/v1
kind: Deployment

metadata:
  name: java-app-deployment

spec:
  replicas: 1

  selector:
    matchLabels:
      app: java-app

  template:
    metadata:
      labels:
        app: java-app

    spec:
      containers:
      - name: java-app
        image: java-app:latest
        imagePullPolicy: IfNotPresent

        ports:
        - containerPort: 8888

        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"

          limits:
            memory: "256Mi"
            cpu: "200m"
